{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-warning">
            <h3>✏️ Edit Holding</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <!-- Asset Information -->

                <h5 class="mb-3">Asset Information</h5>

                <div class="row mb-4">

                    <div class="col-md-6">

                        <label class="form-label">Asset</label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ holding.asset_name }} ({{ holding.ticker }})"
                            readonly>

                    </div>

                    <div class="col-md-3">

                        <label class="form-label">Country</label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ holding.country }}"
                            readonly>

                    </div>

                    <div class="col-md-3">

                        <label class="form-label">Currency</label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ holding.currency }}"
                            readonly>

                    </div>

                </div>

                <div class="row mb-4">

                    <div class="col-md-6">

                        <label class="form-label">Account</label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ holding.platform }}"
                            readonly>

                    </div>

                </div>

                <hr>

                <h5 class="mb-3">Holding Details</h5>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Quantity
                        </label>

                        <input
                            type="number"
                            step="0.000001"
                            name="quantity"
                            class="form-control"
                            value="{{ holding.quantity }}"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Average Cost
                        </label>

                        <input
                            type="number"
                            step="0.000001"
                            name="average_cost"
                            class="form-control"
                            value="{{ holding.average_cost }}"
                            required>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Total Fees
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            name="total_fees"
                            class="form-control"
                            value="{{ holding.total_fees }}">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Current Price
                        </label>

                        <input
                            type="number"
                            step="0.000001"
                            name="current_price"
                            class="form-control"
                            value="{{ holding.current_price }}"
                            required>

                    </div>

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Remarks
                    </label>

                    <textarea
                        name="remarks"
                        class="form-control"
                        rows="4">{{ holding.remarks }}</textarea>

                </div>

                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-warning">

                        💾 Update Holding

                    </button>

                    <a
                        href="/holdings"
                        class="btn btn-secondary">

                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
