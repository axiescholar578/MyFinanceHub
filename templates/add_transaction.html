{% extends "base.html" %}

{% block content %}

<div class="container">

    <h2 class="mb-4">➕ Add Transaction</h2>

    <form method="POST">

        <div class="row">

            <div class="col-md-4 mb-3">
                <label>Date</label>
                <input type="date"
                       name="transaction_date"
                       class="form-control"
                       required>
            </div>

            <div class="col-md-4 mb-3">
                <label>Transaction Type</label>

                <select name="transaction_type"
                        class="form-select"
                        required>

                    <option value="">Select</option>
                    <option value="BUY">BUY</option>
                    <option value="SELL">SELL</option>
                    <option value="DIVIDEND">DIVIDEND</option>
                    <option value="INTEREST">INTEREST</option>
                    <option value="DEPOSIT">DEPOSIT</option>
                    <option value="WITHDRAWAL">WITHDRAWAL</option>

                </select>

            </div>

            <div class="col-md-4 mb-3">

                <label>Asset</label>

                <select name="asset_id"
                        class="form-select"
                        required>

                    {% for asset in assets %}

                    <option value="{{ asset.id }}">

                        {{ asset.asset_name }}
                        ({{ asset.ticker }})

                    </option>

                    {% endfor %}

                </select>

            </div>

        </div>

        <div class="row">

            <div class="col-md-6 mb-3">

                <label>Account</label>

                <select name="account_id"
                        class="form-select"
                        required>

                    {% for account in accounts %}

                    <option value="{{ account.id }}">

                        {{ account.account_name }}

                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="col-md-3 mb-3">

                <label>Quantity</label>

                <input type="number"
                       step="0.000001"
                       name="quantity"
                       class="form-control"
                       value="0">

            </div>

            <div class="col-md-3 mb-3">

                <label>Price</label>

                <input type="number"
                       step="0.000001"
                       name="price"
                       class="form-control"
                       value="0">

            </div>

        </div>

        <div class="row">

            <div class="col-md-4 mb-3">

                <label>Fees</label>

                <input type="number"
                       step="0.01"
                       name="fees"
                       class="form-control"
                       value="0">

            </div>

            <div class="col-md-4 mb-3">

                <label>Exchange Rate</label>

                <input type="number"
                       step="0.000001"
                       name="exchange_rate"
                       class="form-control"
                       value="1">

            </div>

            <div class="col-md-4 mb-3">

                <label>Cash Amount</label>

                <input type="number"
                       step="0.01"
                       name="cash_amount"
                       class="form-control"
                       value="0">

            </div>

        </div>

        <div class="mb-3">

            <label>Remarks</label>

            <textarea
                name="remarks"
                class="form-control"
                rows="3"></textarea>

        </div>

        <button class="btn btn-success">

            Save Transaction

        </button>

        <a href="/transactions"
           class="btn btn-secondary">

            Cancel

        </a>

    </form>

</div>

{% endblock %}
