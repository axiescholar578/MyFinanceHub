{% extends "base.html" %}

{% block content %}

<div class="container">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h4>📈 Add Holding</h4>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label>Purchase Date</label>
                        <input type="date"
                               name="purchase_date"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Asset Class</label>

                        <select name="asset_class"
                                class="form-select"
                                required>

                            <option>Cash</option>
                            <option>Fixed Deposit</option>
                            <option>Stock</option>
                            <option>ETF</option>
                            <option>REIT</option>
                            <option>Bond</option>
                            <option>Mutual Fund</option>
                            <option>Crypto</option>
                            <option>Property</option>
                            <option>CPF</option>

                        </select>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>Platform</label>

                        <select name="platform"
                                class="form-select">

                            <option>Moomoo</option>
                            <option>Tiger</option>
                            <option>Endowus</option>
                            <option>DBS Vickers</option>
                            <option>Maybank KE</option>
                            <option>MetaMask</option>
                            <option>Ledger</option>
                            <option>Manual</option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Account Name</label>

                        <input
                            type="text"
                            name="account_name"
                            class="form-control"
                            placeholder="Main Portfolio">

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>Ticker</label>

                        <input
                            type="text"
                            name="ticker"
                            class="form-control"
                            placeholder="AAPL">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Asset Name</label>

                        <input
                            type="text"
                            name="asset_name"
                            class="form-control"
                            required>

                    </div>

                </div>

                <div class="row">

                    <div class="row">

                        <div class="col-md-4 mb-3">

                    <label>Country</label>

                    <select
                        name="country"
                        class="form-select">

                        <option>USA</option>
                        <option>Singapore</option>
                        <option>Malaysia</option>
                        <option>Others</option>

                    </select>

                </div>

                <div class="col-md-4 mb-3">

                    <label>Currency</label>

                    <select
                        name="currency"
                        class="form-select">

                        <option>USD</option>
                        <option>SGD</option>
                        <option>MYR</option>

                    </select>

                </div>

                <div class="col-md-4 mb-3">

                    <label>Quantity</label>

                    <input
                        type="number"
                        step="0.000001"
                        id="quantity"
                        name="quantity"
                        class="form-control"
                        required>

                </div>

                    <div class="col-md-4 mb-3">

                        <label>Quantity</label>

                        <input
                            type="number"
                            step="0.000001"
                            id="quantity"
                            name="quantity"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label>Average Cost</label>

                        <input
                            type="number"
                            step="0.0001"
                            id="average_cost"
                            name="average_cost"
                            class="form-control"
                            required>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>Total Fees</label>

                        <input
                            type="number"
                            step="0.01"
                            id="fees"
                            name="total_fees"
                            class="form-control"
                            value="0">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Current Price</label>

                        <input
                            type="number"
                            step="0.0001"
                            id="current_price"
                            name="current_price"
                            class="form-control"
                            required>

                    </div>

                </div>

                <div class="mb-3">

                    <label>Remarks</label>

                    <textarea
                        name="remarks"
                        class="form-control"></textarea>

                </div>

                <button class="btn btn-success">

                    Save Holding

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
