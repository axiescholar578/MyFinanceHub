{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>📈 Add Holding</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="row">

                    <!-- LEFT COLUMN -->

                    <div class="col-md-6">

                        <div class="mb-3">
                            <label class="form-label">Purchase Date</label>
                            <input type="date"
                                   name="purchase_date"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Platform</label>
                            <input type="text"
                                   name="platform"
                                   class="form-control"
                                   placeholder="DBS Vickers"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Ticker</label>
                            <input type="text"
                                   name="ticker"
                                   class="form-control"
                                   placeholder="AAPL"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Country</label>
                            <input type="text"
                                   name="country"
                                   class="form-control"
                                   placeholder="United States"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Quantity</label>
                            <input type="number"
                                   step="0.000001"
                                   name="quantity"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Total Fees</label>
                            <input type="number"
                                   step="0.01"
                                   name="total_fees"
                                   value="0"
                                   class="form-control">
                        </div>

                    </div>

                    <!-- RIGHT COLUMN -->

                    <div class="col-md-6">

                        <div class="mb-3">
                            <label class="form-label">Asset Class</label>
                            <input type="text"
                                   name="asset_class"
                                   class="form-control"
                                   placeholder="Stock / ETF / REIT / Cash"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Account Name</label>
                            <input type="text"
                                   name="account_name"
                                   class="form-control"
                                   placeholder="Main Portfolio"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Asset Name</label>
                            <input type="text"
                                   name="asset_name"
                                   class="form-control"
                                   placeholder="Apple Inc."
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Currency</label>
                            <input type="text"
                                   name="currency"
                                   class="form-control"
                                   placeholder="USD"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Average Cost (per share/unit)</label>
                            <input type="number"
                                   step="0.000001"
                                   name="average_cost"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Current Price</label>
                            <input type="number"
                                   step="0.000001"
                                   name="current_price"
                                   class="form-control">
                        </div>

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">Remarks</label>

                    <textarea
                        name="remarks"
                        rows="3"
                        class="form-control"></textarea>

                </div>

                <button class="btn btn-success w-100">

                    💾 Save Holding

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
