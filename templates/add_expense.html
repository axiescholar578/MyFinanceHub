{% extends "base.html" %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-danger text-white">

        <h4>
            <i class="bi bi-wallet2"></i>
            Add Expense
        </h4>

    </div>

    <div class="card-body">

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">Date</label>

                <input
                    type="date"
                    name="transaction_date"
                    class="form-control"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">Category</label>

                <input
                    type="text"
                    name="category"
                    class="form-control"
                    placeholder="Food, Petrol, Shopping..."
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">Description</label>

                <input
                    type="text"
                    name="description"
                    class="form-control">

            </div>

            <div class="mb-3">

                <label class="form-label">Amount</label>

                <input
                    type="number"
                    step="0.01"
                    name="amount"
                    class="form-control"
                    required>

            </div>

            <button class="btn btn-danger">

                <i class="bi bi-save"></i>

                Save Expense

            </button>

        </form>

    </div>

</div>

{% endblock %}
