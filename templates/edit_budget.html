{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-header bg-warning text-dark">

                <h4 class="mb-0">
                    <i class="bi bi-pencil-square"></i>
                    Edit Budget
                </h4>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Month
                        </label>

                        <input
                            type="month"
                            class="form-control"
                            name="month"
                            value="{{ budget.month[:7] }}"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Category
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            name="category"
                            value="{{ budget.category }}"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Budget Amount
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            class="form-control"
                            name="budget_amount"
                            value="{{ budget.budget_amount }}"
                            required>

                    </div>

                    <div class="d-grid">

                        <button class="btn btn-warning">

                            <i class="bi bi-check-circle"></i>
                            Update Budget

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
