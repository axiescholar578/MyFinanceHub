{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow">

            <div class="card-header">
                <h4 class="mb-0">✏️ Edit Account</h4>
            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Platform</label>
                            <select name="platform" class="form-select" required>
                                <option value="Moomoo">Moomoo</option>
                                <option value="Tiger">Tiger</option>
                                <option value="Endowus">Endowus</option>
                                <option value="DBS Vickers">DBS Vickers</option>
                                <option value="Maybank KE">Maybank KE</option>
                                <option value="MetaMask">MetaMask</option>
                                <option value="Ledger">Ledger</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Account Name</label>
                            <input type="text" name="account_name"
                                   class="form-control" required>
                                   value="{{ account.account_name }}" required>
                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Account Type</label>
                            <select name="account_type" class="form-select" required>
                                <option value="Brokerage">Brokerage</option>
                                <option value="Bank">Bank</option>
                                <option value="CPF">CPF</option>
                                <option value="Crypto Wallet">Crypto Wallet</option>
                                <option value="Cash">Cash</option>
                                <option value="Fixed Deposit">Fixed Deposit</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Country</label>
                            <select name="country" class="form-select" required>
                                <option value="Singapore">Singapore</option>
                                <option value="Malaysia">Malaysia</option>
                                <option value="USA">USA</option>
                                <option value="Hong Kong">Hong Kong</option>
                                <option value="China">China</option>
                                <option value="Japan">Japan</option>
                            </select>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Base Currency</label>
                            <select name="base_currency" class="form-select" required>
                                <option value="SGD">SGD</option>
                                <option value="USD">USD</option>
                                <option value="MYR">MYR</option>
                            </select>
                        </div>

                    </div>

                    <div class="mb-3">
                        <label class="form-label">Remarks</label>
                        <textarea name="remarks"
                                  class="form-control"
                                  rows="3"></textarea>
                    </div>

                    <button type="submit" class="btn btn-success">
                        Save Account
                    </button>

                    <a href="/accounts" class="btn btn-secondary">
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
