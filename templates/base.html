<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Finance Hub</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- DataTables CSS -->
    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/dataTables.bootstrap5.min.css') }}">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body class="bg-light">

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">

        <div class="container">

            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-wallet2"></i>
                My Finance Hub
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            <i class="bi bi-speedometer2"></i>
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/add-income">
                            <i class="bi bi-cash-stack"></i>
                            Add Income
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/add-expense">
                            <i class="bi bi-wallet2"></i>
                            Add Expense
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/add-holding">
                        <i class="bi bi-graph-up"></i>
                        Add Holding
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/holdings">
                        <i class="bi bi-graph-up-arrow"></i>
                        Holdings
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/accounts">
                        <i class="bi bi-bank"></i> Accounts
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/investment">
                        <i class="bi bi-bar-chart-line"></i>
                        Investment Dashboard
                        </a>
                    </li>
                </ul>

            </div>

        </div>

    </nav>

    <!-- Main Content -->
    <div class="container mt-4">

        {% block content %}
        {% endblock %}

    </div>

<!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- Chart.js -->
    <script src="{{ url_for('static', filename='js/chart.umd.min.js') }}"></script>

<!-- jQuery -->
    <script src="{{ url_for('static', filename='js/jquery.min.js') }}"></script>

<!-- DataTables -->
    <script src="{{ url_for('static', filename='js/jquery.dataTables.min.js') }}"></script>

    <script src="{{ url_for('static', filename='js/dataTables.bootstrap5.min.js') }}"></script>

</body>
</html>
