{% extends "base.html" %}

{% block content %}

<div class="card shadow">

<div class="card-header bg-success text-white">

<h3>Add New Income</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label>Date</label>

<input
type="date"
name="income_date"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Source</label>

<input
type="text"
name="source"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Category</label>

<input
type="text"
name="category"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Amount</label>

<input
type="number"
step="0.01"
name="amount"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Remarks</label>

<textarea
name="remarks"
class="form-control"></textarea>

</div>

<button class="btn btn-success">

💾 Save Income

</button>

<a href="/" class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

{% endblock %}
