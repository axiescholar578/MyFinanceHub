{% extends "base.html" %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-primary text-white">
        <h4>Add Budget</h4>
    </div>

    <div class="card-body">

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">Category</label>

                <input
                    type="text"
                    name="category"
                    class="form-control"
                    placeholder="Example: Food"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">Budget Amount</label>

                <input
                    type="number"
                    step="0.01"
                    name="budget_amount"
                    class="form-control"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">Month</label>

                <input
                    type="month"
                    name="month"
                    class="form-control"
                    required>

            </div>

            <button class="btn btn-primary">
                Save Budget
            </button>

            <a href="/" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
